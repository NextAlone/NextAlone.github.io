<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Never Gonna Give You Up - Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Interstate', 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Garuda, Verdana, Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .player-header {
            background: linear-gradient(135deg, #ff5500, #ff8800);
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .player-title {
            font-size: 24px;
            font-weight: 600;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .mode-btn.active {
            background: white;
            color: #ff5500;
            border-color: white;
        }

        .media-wrapper {
            position: relative;
            background: #000;
            width: 100%;
        }

        #videoContainer {
            width: 100%;
            height: 500px;
        }

        #videoContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #videoPlayer {
            width: 100%;
            height: auto;
            display: block;
        }

        #audioPlayer {
            display: none;
        }

        .audio-visualizer {
            width: 100%;
            height: 400px;
            background: linear-gradient(180deg, #333 0%, #111 100%);
            display: none;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .audio-visualizer.active {
            display: flex;
        }

        .waveform-container {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 0 20px;
        }

        .wave-bar {
            flex: 1;
            max-width: 6px;
            background: linear-gradient(180deg, #ff5500, #ff8800);
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes wave {
            0%, 100% { height: 30px; }
            50% { height: 100px; }
        }

        .track-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 10;
        }

        .track-info h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .track-info p {
            font-size: 18px;
            opacity: 0.8;
        }

        .controls {
            padding: 20px;
            background: #f7f7f7;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e1e1e1;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff5500, #ff8800);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .play-pause-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff5500, #ff8800);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .play-pause-btn:hover {
            transform: scale(1.1);
        }

        .time-display {
            font-size: 14px;
            color: #666;
            min-width: 100px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 200px;
        }

        .volume-icon {
            font-size: 20px;
            color: #666;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #e1e1e1;
            outline: none;
            -webkit-appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff5500;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff5500;
            cursor: pointer;
            border: none;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .player-header {
                padding: 15px;
            }

            .player-title {
                font-size: 20px;
                width: 100%;
            }

            .mode-toggle {
                width: 100%;
                justify-content: center;
            }

            #videoContainer {
                height: 300px;
            }

            .audio-visualizer {
                height: 300px;
            }

            .track-info h2 {
                font-size: 24px;
            }

            .track-info p {
                font-size: 16px;
            }

            .controls {
                padding: 15px;
            }

            .control-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .volume-control {
                width: 100%;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .player-title {
                font-size: 18px;
            }

            .mode-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            #videoContainer {
                height: 250px;
            }

            .audio-visualizer {
                height: 250px;
            }

            .track-info h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <div class="player-title">🎵 Never Gonna Give You Up</div>
            <div class="mode-toggle">
                <button class="mode-btn active" id="audioMode">🎵 Audio</button>
                <button class="mode-btn" id="videoMode">🎬 Video</button>
            </div>
        </div>

        <div class="media-wrapper">
            <!-- Video Player - Bilibili iframe -->
            <div id="videoContainer" style="display: none;">
                <iframe id="videoPlayer" 
                    title="Never Gonna Give You Up - Rick Astley Video Player"
                    src="https://player.bilibili.com/player.html?aid=80433022&bvid=BV1GJ411x7h7&cid=137649199&page=1&danmaku=0&autoplay=1&high_quality=1" 
                    allowfullscreen
                    allow="autoplay">
                </iframe>
            </div>

            <!-- Audio Player with Visualizer -->
            <div class="audio-visualizer active" id="audioVisualizer">
                <div class="track-info">
                    <h2>Never Gonna Give You Up</h2>
                    <p>Rick Astley</p>
                </div>
                <div class="waveform-container" id="waveform"></div>
            </div>
            
            <audio id="audioPlayer" loop autoplay>
                <!-- Using a public domain audio URL - replace with actual Rick Astley audio if available -->
                <source src="https://ia800905.us.archive.org/19/items/Rick_Astley_Never_Gonna_Give_You_Up/Rick_Astley_Never_Gonna_Give_You_Up.ogg" type="audio/ogg">
                <source src="https://archive.org/download/Rick_Astley_Never_Gonna_Give_You_Up/Rick_Astley_Never_Gonna_Give_You_Up.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="controls">
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="control-buttons">
                <button class="play-pause-btn" id="playPauseBtn">
                    ▶️
                </button>

                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>

                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                </div>
            </div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const audioVisualizer = document.getElementById('audioVisualizer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const audioModeBtn = document.getElementById('audioMode');
        const videoModeBtn = document.getElementById('videoMode');
        const waveformContainer = document.getElementById('waveform');
        const controlsContainer = document.querySelector('.controls');

        let isAudioMode = true;
        let isPlaying = false;

        // Create waveform bars
        for (let i = 0; i < 50; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.animationDelay = `${i * 0.05}s`;
            bar.style.height = `${Math.random() * 70 + 30}px`;
            waveformContainer.appendChild(bar);
        }

        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Play/Pause for audio mode (video controls are in iframe)
        playPauseBtn.addEventListener('click', () => {
            if (isAudioMode) {
                if (isPlaying) {
                    audioPlayer.pause();
                    isPlaying = false;
                    playPauseBtn.textContent = '▶️';
                } else {
                    audioPlayer.play().catch(e => console.log('Play prevented:', e));
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                }
            }
        });

        // Update progress for audio
        function updateProgress() {
            if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressFill.style.width = `${progress}%`;
                currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
                durationEl.textContent = formatTime(audioPlayer.duration);
            }
        }

        audioPlayer.addEventListener('timeupdate', updateProgress);

        // Seek for audio
        progressBar.addEventListener('click', (e) => {
            if (isAudioMode && audioPlayer.duration) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audioPlayer.currentTime = percent * audioPlayer.duration;
            }
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            audioPlayer.volume = volume;
        });

        // Set initial volume
        audioPlayer.volume = 0.7;

        // Helper function to start audio playback
        function startAudioPlayback() {
            // Enable play button for audio mode
            playPauseBtn.style.opacity = '1';
            playPauseBtn.style.cursor = 'pointer';
            
            // Try to play with more aggressive retry
            const attemptPlay = () => {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸️';
                    console.log('Audio playback started successfully');
                }).catch(e => {
                    console.log('Autoplay prevented:', e.message);
                    isPlaying = false;
                    playPauseBtn.textContent = '▶️';
                    
                    // Add click handler to start playback on first user interaction
                    const startOnClick = () => {
                        audioPlayer.play().then(() => {
                            isPlaying = true;
                            playPauseBtn.textContent = '⏸️';
                            document.removeEventListener('click', startOnClick);
                        }).catch(err => console.log('Play failed:', err));
                    };
                    document.addEventListener('click', startOnClick, { once: true });
                });
            };
            
            // Attempt play immediately
            attemptPlay();
        }

        // Mode switching
        function switchToAudioMode() {
            isAudioMode = true;
            
            videoContainer.style.display = 'none';
            audioVisualizer.classList.add('active');
            controlsContainer.style.display = 'block';
            
            audioModeBtn.classList.add('active');
            videoModeBtn.classList.remove('active');
            
            // Try to play audio (autoplay)
            startAudioPlayback();
        }

        function switchToVideoMode() {
            isAudioMode = false;
            
            audioPlayer.pause();
            isPlaying = false;
            audioVisualizer.classList.remove('active');
            videoContainer.style.display = 'block';
            controlsContainer.style.display = 'none';
            
            videoModeBtn.classList.add('active');
            audioModeBtn.classList.remove('active');
        }

        audioModeBtn.addEventListener('click', switchToAudioMode);
        videoModeBtn.addEventListener('click', switchToVideoMode);

        // Auto-play on load (audio mode by default)
        window.addEventListener('load', () => {
            startAudioPlayback();
        });

        // Sync play/pause button with player state
        audioPlayer.addEventListener('play', () => {
            isPlaying = true;
            playPauseBtn.textContent = '⏸️';
        });
        audioPlayer.addEventListener('pause', () => {
            isPlaying = false;
            playPauseBtn.textContent = '▶️';
        });
    </script>
</body>
</html>
